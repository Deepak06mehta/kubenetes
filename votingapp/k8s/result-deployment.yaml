apiVersion: apps/v1
kind: Deployment

metadata:
  name: result

spec:
  replicas: 2

  selector:
    matchLabels:
      app: result

  template:
    metadata:
      labels:
        app: result

    spec:
      containers:
        - name: result
          image: result-app:latest
          imagePullPolicy: Never

---
apiVersion: v1
kind: Service

metadata:
  name: result-service

spec:
  selector:
    app: result

  type: NodePort

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081